services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    # This host is 3.8GB total, shared with several unrelated apps — the
    # stock postgres defaults (effective_cache_size=4GB, i.e. "assume the
    # whole box is free for caching") and unbounded parallel workers were
    # contributing to swap pressure. mem_limit is a hard ceiling so a heavy
    # query/index build can't single-handedly starve the other apps on the
    # box; effective_cache_size is sized to fit under it.
    # shared_preload_libraries=pg_stat_statements is required for Datadog
    # Database Monitoring (query-level metrics/samples/explain plans) — the
    # extension itself still needs `CREATE EXTENSION pg_stat_statements;`
    # run once against the app database after this takes effect, since it
    # can't be preloaded and self-installed in the same step.
    command: postgres -c effective_cache_size=768MB -c max_parallel_workers_per_gather=1 -c shared_preload_libraries=pg_stat_statements -c track_io_timing=on
    mem_limit: 1200m
    mem_reservation: 512m
    ports:
      - "5007:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      com.datadoghq.ad.checks: |
        {
          "postgres": {
            "instances": [
              {
                "host": "%%host%%",
                "port": 5432,
                "username": "datadog",
                "password": "${DD_POSTGRES_PASSWORD}",
                "dbname": "${POSTGRES_DB}",
                "reported_hostname": "osm-monitor-db",
                "tags": ["service:osm-monitor-db", "env:production"],
                "dbm": true
              }
            ]
          }
        }

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DD_SERVICE: osm-monitor
      DD_ENV: production
      DD_TRACE_AGENT_URL: unix:///var/run/datadog/apm.socket
      DD_DOGSTATSD_URL: unix:///var/run/datadog/dsd.socket
      DD_LOGS_INJECTION: "true"
      DD_VERSION: ${GIT_VERSION:-unknown}
    mem_limit: 512m
    ports:
      - "5006:8000"
    volumes:
      - /var/run/datadog:/var/run/datadog:ro

  poller:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DD_SERVICE: osm-monitor-poller
      DD_ENV: production
      DD_TRACE_AGENT_URL: unix:///var/run/datadog/apm.socket
      DD_DOGSTATSD_URL: unix:///var/run/datadog/dsd.socket
      DD_LOGS_INJECTION: "true"
      DD_VERSION: ${GIT_VERSION:-unknown}
    mem_limit: 512m
    volumes:
      - /var/run/datadog:/var/run/datadog:ro
    command: python manage.py poll_sequences --interval 60

volumes:
  postgres-data:
