services:
  db:
    # Switched from timescale/timescaledb:latest-pg16 (Alpine) to this
    # Ubuntu-based image specifically to get PostGIS bundled alongside
    # TimescaleDB in the same Postgres instance — same exact Postgres
    # version (16.15) as before, migrated via a full logical dump/restore
    # (not a physical volume swap) specifically to avoid the Alpine/musl vs.
    # Ubuntu/glibc collation mismatch that a raw data-directory copy between
    # those two libc's would risk corrupting text indexes on.
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    env_file: .env
    # Memory settings are explicit: this image's first-init auto-tuner left
    # shared_buffers at the stock 128MB here, so they're sized by hand for
    # mem_limit (3g) below — shared_buffers 768MB (~25%), effective_cache_size
    # 2GB (planner hint only, allocates nothing), maintenance_work_mem 512MB
    # (index builds, VACUUM, CAgg refreshes). Reduced from 8g on 2026-10-03:
    # the API reads ClickHouse, so Postgres only takes the deprecated
    # TimescaleDB writes and refreshes plus the app's own state, and the
    # memory went to ClickHouse. max_wal_size 8GB spaces out
    # checkpoints during bulk imports (import_from_dump) instead of forcing
    # one every 1GB of WAL. shared_preload_libraries needs both
    # timescaledb (hypertables) and pg_stat_statements (query-level
    # stats, also used by Datadog Database Monitoring if enabled) — the
    # extensions themselves still need `CREATE EXTENSION ...;` run once
    # against the app database after this takes effect, since they can't be
    # preloaded and self-installed in the same step (see changesets/
    # migrations/0018_timescale_hypertable.py and db/init/01-datadog.sh).
    # work_mem=64MB: the default forces GROUP BY aggregates over large group
    # counts (e.g. ToplistView's contributor breakdown, ~223K groups) to
    # spill to disk mid-query. Passed via `command:`, not postgresql.conf:
    # this image's entrypoint execs `postgres` directly (PID 1 is
    # `postgres`, not a Patroni/supervisor wrapper), so plain `-c` flags
    # take precedence over the auto-tuner's own postgresql.conf values.
    command: postgres -c shared_preload_libraries=timescaledb,pg_stat_statements -c track_io_timing=on -c track_activity_query_size=4096 -c work_mem=64MB -c shared_buffers=768MB -c effective_cache_size=2GB -c maintenance_work_mem=512MB -c max_wal_size=8GB
    mem_limit: 3g
    mem_reservation: 1g
    # Docker's default /dev/shm is 64MB, shared by every parallel-worker's
    # dynamic shared memory segment (Postgres's default
    # dynamic_shared_memory_type=posix backs these with /dev/shm, not the
    # mem_limit-backed shared_buffers). A `VACUUM ANALYZE` on
    # changesets_changeset once needed ~112MB for a single parallel worker's
    # segment, and blowing past shm_size crashes the whole postmaster (it's
    # treated as possible shared-memory corruption), not just the one
    # statement. shm counts against mem_limit.
    shm_size: 512m
    ports:
      - "5007:5432"
    volumes:
      # Bind mount of a host directory (PGDATA_DIR in .env) rather than a
      # Docker volume, so the database lives on the host filesystem and
      # survives the Colima VM being deleted/recreated, not just restarts.
      # The host directory must be shared into the VM (colima --mount).
      - ${PGDATA_DIR:?set PGDATA_DIR in .env}:/home/postgres/pgdata/data
      # Only runs on a genuinely fresh data directory — see db/init/'s own
      # comments for what still needs doing manually on the existing volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Analytics database: holds every changeset and answers the API's
  # questions (ANALYTICS_BACKEND, default clickhouse). Postgres (db above)
  # keeps the app's own state and, while TimescaleDB is being phased out,
  # still receives a copy of every changeset (INGEST_BACKENDS) — see
  # CLAUDE.md's "Analytics backends" section.
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.7.9
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-osm_monitor}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-osm_monitor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # Host directory, like Postgres's PGDATA_DIR: survives the Docker VM
    # being deleted/recreated.
    volumes:
      - ${CLICKHOUSE_DATA_DIR:?set CLICKHOUSE_DATA_DIR in .env}:/var/lib/clickhouse
      # Retention + verbosity for ClickHouse's own system log tables (unbounded
      # and at `trace` level by default).
      - ./clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    # ClickHouse sizes its own memory budget from the container limit (90% by
    # default). 6g since 2026-10-03 (was 4g), taken from Postgres: the object
    # tables (object_versions) add large merges and queries.
    mem_limit: 6g
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface, local only (benchmarks, manual queries)
    # Datadog ClickHouse check + Database Monitoring, used only when the
    # Datadog overlay's agent runs (otherwise inert). Connects as the
    # least-privilege `datadog` user clickhouse_migrate creates from
    # DD_CLICKHOUSE_PASSWORD.
    labels:
      com.datadoghq.ad.checks: |
        {
          "clickhouse": {
            "instances": [
              {
                "server": "%%host%%",
                "port": 8123,
                "username": "datadog",
                "password": "${DD_CLICKHOUSE_PASSWORD:-}",
                "db": "${CLICKHOUSE_DB:-osm_monitor}",
                "reported_hostname": "osm-monitor-clickhouse",
                "tags": ["service:osm-monitor-clickhouse", "env:production"],
                "dbm": true
              }
            ]
          }
        }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Loading the tables after a restart can outlast retries x interval
      # (2026-10-03: a deploy failed on "clickhouse is unhealthy" while it
      # was still starting); failures during start_period don't count.
      start_period: 3m


  # One-shot: runs migrations once before web/poller start, instead of each
  # of them running `migrate` themselves on every container start (the old
  # entrypoint.sh behavior) — that raced when both started together.
  migrate:
    build: .
    env_file: .env
    environment:
      # The app role now defaults to a bounded statement_timeout (see
      # db/init/02-role-statement-timeout.sh) — a migration's DDL (e.g. an
      # index build over the full hypertable) can legitimately run past
      # that, so exempt this service the same way `web` is exempted in the
      # other direction (30s cap there; 0 = no cap here).
      DB_STATEMENT_TIMEOUT_MS: "0"
      DD_TRACE_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # load_country_boundaries --if-empty: ingestion resolves country_code
    # against country_boundaries, so a fresh database needs it loaded before
    # any changeset is ingested — a no-op once loaded. clickhouse_migrate
    # applies the ClickHouse schema (idempotent).
    command: sh -c "python manage.py migrate --no-input && python manage.py load_country_boundaries --if-empty && python manage.py clickhouse_migrate"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    # Deliberately no dependency on clickhouse: a ClickHouse restart must not
    # take the pages down with it (the API answers 503 meanwhile).
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Tracing off unless docker-compose.datadog.yml turns it on (ddtrace
      # is imported by the app, and would otherwise retry a missing agent).
      DD_TRACE_ENABLED: "false"
      # Web-only, not set for poller: a request-serving query has no
      # business running longer than a user will wait, and failing fast
      # avoids the orphaned-backend pileup seen when gunicorn's own worker
      # timeout kills the client but leaves the query running server-side.
      # Must stay comfortably under gunicorn's --timeout (entrypoint.sh) —
      # equal-or-higher would race it instead of cancelling first. Not
      # applied to poller/management commands, which legitimately run long
      # queries (rollup full rebuilds, bulk imports).
      DB_STATEMENT_TIMEOUT_MS: "30000"
    mem_limit: 512m
    ports:
      - "5006:8000"

  poller:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Tracing off unless docker-compose.datadog.yml turns it on (ddtrace
      # is imported by the app, and would otherwise retry a missing agent).
      DD_TRACE_ENABLED: "false"
    mem_limit: 512m
    command: python manage.py poll_sequences --interval 60

  # Object changes: follows the minutely osmChange diffs into ClickHouse's
  # object tables and backfills the last 92 days from the daily diffs (see
  # docs/decisions/object-changes.md). ClickHouse only, so it doesn't wait
  # for the Postgres-heavy poller; Postgres holds only its position.
  diff-poller:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DD_TRACE_ENABLED: "false"
    # Measured peak ~200 MB on the largest daily diff seen (2026-09-16, 7.5M
    # versions); 1g leaves room for bigger days (see
    # docs/decisions/object-changes.md, Operations).
    mem_limit: 1g
    command: python manage.py poll_diffs --interval 60
