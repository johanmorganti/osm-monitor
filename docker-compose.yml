services:
  db:
    # Switched from timescale/timescaledb:latest-pg16 (Alpine) to this
    # Ubuntu-based image specifically to get PostGIS bundled alongside
    # TimescaleDB in the same Postgres instance — same exact Postgres
    # version (16.15) as before, migrated via a full logical dump/restore
    # (not a physical volume swap) specifically to avoid the Alpine/musl vs.
    # Ubuntu/glibc collation mismatch that a raw data-directory copy between
    # those two libc's would risk corrupting text indexes on.
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    env_file: .env
    # This host is 3.8GB total, shared with several unrelated apps.
    # Unlike the old Alpine image, this one auto-tunes shared_buffers/
    # effective_cache_size/work_mem from the container's own memory cgroup
    # limit at first init (see mem_limit below) — no manual
    # effective_cache_size override needed. The settings below are ones the
    # auto-tuner doesn't set: shared_preload_libraries needs both
    # timescaledb (hypertables) and pg_stat_statements (Datadog Database
    # Monitoring's query-level metrics/samples/explain plans) — the
    # extensions themselves still need `CREATE EXTENSION ...;` run once
    # against the app database after this takes effect, since they can't be
    # preloaded and self-installed in the same step (see changesets/
    # migrations/0018_timescale_hypertable.py and db/init/01-datadog-dbm.sql).
    # work_mem=32MB: default was forcing GROUP BY aggregates over the
    # rollup tables (e.g. ToplistView's contributor breakdown, ~223K groups)
    # to spill to disk mid-query — pure wasted I/O on an already I/O-
    # constrained host. 32MB comfortably covers what we've observed spilling
    # (~16MB) without risking the container's mem_limit under normal
    # concurrency (this host serves one gunicorn worker + the poller, not a
    # high-concurrency pool). Passed via `command:`, not postgresql.conf:
    # this image's entrypoint still execs `postgres` directly (confirmed via
    # `ps aux` inside the container — PID 1 is `postgres`, not a Patroni/
    # supervisor wrapper), so plain `-c` flags apply the same way they did
    # on the old image, and take precedence over the auto-tuner's own
    # postgresql.conf values.
    command: postgres -c shared_preload_libraries=timescaledb,pg_stat_statements -c track_io_timing=on -c track_activity_query_size=4096 -c work_mem=32MB
    mem_limit: 1400m
    mem_reservation: 512m
    ports:
      - "5007:5432"
    volumes:
      # Note the different data path vs. the old Alpine image
      # (/var/lib/postgresql/data) — this image's own convention.
      - timescale-ha-data:/home/postgres/pgdata/data
      # Only runs on a genuinely fresh data directory — see db/init/'s own
      # comments for what still needs doing manually on the existing volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      com.datadoghq.ad.checks: |
        {
          "postgres": {
            "instances": [
              {
                "host": "%%host%%",
                "port": 5432,
                "username": "datadog",
                "password": "${DD_POSTGRES_PASSWORD}",
                "dbname": "${POSTGRES_DB}",
                "reported_hostname": "osm-monitor-db",
                "tags": ["service:osm-monitor-db", "env:production"],
                "dbm": true,
                "min_collection_interval": 60,
                "query_metrics": {"collection_interval": 60},
                "query_samples": {"collection_interval": 60}
              }
            ]
          }
        }

  # One-shot: runs migrations once before web/poller start, instead of each
  # of them running `migrate` themselves on every container start (the old
  # entrypoint.sh behavior) — that raced when both started together, see
  # TODO.md's "Migration race" entry.
  migrate:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py migrate --no-input

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DD_SERVICE: osm-monitor
      DD_ENV: production
      DD_TRACE_AGENT_URL: unix:///var/run/datadog/apm.socket
      DD_DOGSTATSD_URL: unix:///var/run/datadog/dsd.socket
      DD_LOGS_INJECTION: "true"
      DD_VERSION: ${GIT_VERSION:-unknown}
      # Web-only, not set for poller: a request-serving query has no
      # business running longer than a user will wait, and failing fast
      # avoids the orphaned-backend pileup seen when gunicorn's own worker
      # timeout kills the client but leaves the query running server-side.
      # Must stay comfortably under gunicorn's --timeout (entrypoint.sh) —
      # equal-or-higher would race it instead of cancelling first. Not
      # applied to poller/management commands, which legitimately run long
      # queries (rollup full rebuilds, bulk imports).
      DB_STATEMENT_TIMEOUT_MS: "30000"
    mem_limit: 512m
    ports:
      - "5006:8000"
    volumes:
      - /var/run/datadog:/var/run/datadog:ro

  poller:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DD_SERVICE: osm-monitor-poller
      DD_ENV: production
      DD_TRACE_AGENT_URL: unix:///var/run/datadog/apm.socket
      DD_DOGSTATSD_URL: unix:///var/run/datadog/dsd.socket
      DD_LOGS_INJECTION: "true"
      DD_VERSION: ${GIT_VERSION:-unknown}
    mem_limit: 512m
    volumes:
      - /var/run/datadog:/var/run/datadog:ro
    command: python manage.py poll_sequences --interval 60

volumes:
  postgres-data:
  timescale-data: # old Alpine-image data dir, kept (unused) as a rollback fallback — see timescale-ha-data
  timescale-ha-data:
    external: true
    name: osm-monitor-pg16ha-data
