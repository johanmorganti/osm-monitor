# The app's own state (the pollers' positions, Django's tables) is a SQLite
# file in a host directory (SQLITE_DIR in .env), shared by migrate, web,
# poller and diff-poller: survives the Docker VM being deleted/recreated, like
# ClickHouse's data. Postgres/TimescaleDB were removed on 2026-10-05.
x-sqlite: &sqlite
  volumes:
    - ${SQLITE_DIR:?set SQLITE_DIR in .env}:/data
x-sqlite-env: &sqlite-env
  SQLITE_PATH: /data/osm-monitor.sqlite3

services:
  # Analytics database: holds every changeset and object and answers the
  # API's questions (see docs/decisions/analytics-backends.md).
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.7.9
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-osm_monitor}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-osm_monitor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # Host directory: survives the Docker VM being deleted/recreated.
    volumes:
      - ${CLICKHOUSE_DATA_DIR:?set CLICKHOUSE_DATA_DIR in .env}:/var/lib/clickhouse
      # Retention + verbosity for ClickHouse's own system log tables (unbounded
      # and at `trace` level by default).
      - ./clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    # ClickHouse sizes its own memory budget from the container limit (90% by
    # default). 9g on a 16 GB / 8 vCPU host (2026-10-26; was 5g in an 8 GB
    # VM): its largest query in two days took 2.9 GB, typical ones ~30 MB, and
    # the rest of the host's memory serves as page cache for its data files.
    mem_limit: 9g
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface, local only (benchmarks, manual queries)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Loading the tables after a restart can outlast retries x interval
      # (2026-10-03: a deploy failed on "clickhouse is unhealthy" while it
      # was still starting); failures during start_period don't count.
      start_period: 3m


  # One-shot: runs migrations once before web/poller start, instead of each
  # of them running `migrate` themselves on every container start (the old
  # entrypoint.sh behavior) — that raced when both started together.
  migrate:
    build: .
    env_file: .env
    <<: *sqlite
    environment:
      <<: *sqlite-env
    depends_on:
      clickhouse:
        condition: service_healthy
    # clickhouse_migrate applies the ClickHouse schema (idempotent). Country
    # lookup at ingest reads changesets/data/country_boundaries.geojson
    # directly (changesets/ingest/locate.py), so no table needs loading.
    command: sh -c "python manage.py migrate --no-input && python manage.py clickhouse_migrate"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    # Deliberately no dependency on clickhouse: a ClickHouse restart must not
    # take the pages down with it (the API answers 503 meanwhile).
    depends_on:
      migrate:
        condition: service_completed_successfully
    <<: *sqlite
    environment:
      <<: *sqlite-env
      # gunicorn workers (x 8 threads each, see entrypoint.sh): one per two
      # vCPUs on the 8 vCPU host. ~2g covers 4 workers' Django footprint
      # with headroom (was 2 workers in 512m).
      GUNICORN_WORKERS: "4"
    mem_limit: 2g
    # Local only: the host has a public IP, and Docker's published ports
    # bypass host firewall rules. Public traffic comes in via Cloudflare.
    ports:
      - "127.0.0.1:5006:8000"
    # Also on the shared `cloudflare` network, where a Cloudflare Tunnel
    # (its own compose project) reaches it as http://osm-monitor:8000.
    networks:
      default:
      cloudflare:
        aliases: [osm-monitor]

  poller:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    <<: *sqlite
    environment:
      <<: *sqlite-env
    mem_limit: 512m
    command: python manage.py poll_sequences --interval 60

  # Object changes: follows the minutely osmChange diffs into ClickHouse's
  # object tables and backfills the last 92 days from the daily diffs (see
  # docs/decisions/object-changes.md). Its position is in the SQLite file.
  diff-poller:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    <<: *sqlite
    environment:
      <<: *sqlite-env
    # Measured peak ~200 MB on the largest daily diff seen (2026-09-16, 7.5M
    # versions); 1g leaves room for bigger days (see
    # docs/decisions/object-changes.md, Operations).
    mem_limit: 1g
    command: python manage.py poll_diffs --interval 60

networks:
  # Shared with other compose projects on the host (the tunnel), hence the
  # fixed name: whichever project starts first creates it.
  cloudflare:
    name: cloudflare
