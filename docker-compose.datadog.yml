# Optional Datadog integration, layered on top of docker-compose.yml: APM traces
# (ddtrace), log/trace correlation, and the ClickHouse check with Database
# Monitoring. The Datadog agent itself is not part of this stack: run it on the
# host the way you want (its API key and settings live with it), with
#   - APM and DogStatsD on unix sockets in one host directory:
#     DD_APM_RECEIVER_SOCKET=/var/run/datadog/apm.socket and
#     DD_DOGSTATSD_SOCKET=/var/run/datadog/dsd.socket, that directory mounted
#     from the host (DD_SOCKET_DIR below, default /var/run/datadog);
#   - container log collection (DD_LOGS_ENABLED, DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL);
#   - the docker socket, so it reads the ClickHouse label below (autodiscovery).
#
# Enable it by adding to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.datadog.yml
#   DD_CLICKHOUSE_PASSWORD=...  (the `datadog` ClickHouse user, see clickhouse_migrate)
# Setting COMPOSE_FILE in .env (rather than passing -f per command) makes
# every `docker compose` invocation see the same merged config, so an ad-hoc
# `docker compose up` doesn't silently recreate services without it.

services:
  clickhouse:
    # ClickHouse check + Database Monitoring, read by the agent from this label.
    # Connects as the least-privilege `datadog` user clickhouse_migrate creates
    # from DD_CLICKHOUSE_PASSWORD.
    labels:
      com.datadoghq.ad.checks: |
        {
          "clickhouse": {
            "instances": [
              {
                "server": "%%host%%",
                "port": 8123,
                "username": "datadog",
                "password": "${DD_CLICKHOUSE_PASSWORD:-}",
                "db": "${CLICKHOUSE_DB:-osm_monitor}",
                "reported_hostname": "osm-monitor-clickhouse",
                "tags": ["service:osm-monitor-clickhouse", "env:prod"],
                "dbm": true
              }
            ]
          }
        }

  web:
    # The image with ddtrace (requirements-datadog.txt).
    build: &dd-build
      context: .
      args:
        DATADOG: "true"
    environment: &app-dd-env
      DD_TRACE_ENABLED: "true"
      DD_ENV: prod
      DD_TRACE_AGENT_URL: unix:///var/run/datadog/apm.socket
      DD_DOGSTATSD_URL: unix:///var/run/datadog/dsd.socket
      DD_LOGS_INJECTION: "true"
      DD_VERSION: ${GIT_VERSION:-unknown}
      DD_SERVICE: osm-monitor
    volumes: &dd-sockets
      # The host agent's APM/DogStatsD sockets. Nothing waits for the agent:
      # ddtrace just drops data while it's absent.
      - ${DD_SOCKET_DIR:-/var/run/datadog}:/var/run/datadog:ro

  poller:
    build: *dd-build
    environment:
      <<: *app-dd-env
      DD_SERVICE: osm-monitor-poller
    volumes: *dd-sockets

  diff-poller:
    build: *dd-build
    environment:
      <<: *app-dd-env
      DD_SERVICE: osm-monitor-diff-poller
    volumes: *dd-sockets
