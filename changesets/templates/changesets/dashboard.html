{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">OSM Changeset Dashboard</h1>
    
    <!-- Time Range Picker -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-xl font-semibold mb-4">Select Time Range</h2>
        <form method="get" class="flex flex-wrap gap-4">
            <div>
                <label for="start_date" class="block text-sm font-medium text-gray-700">Start Date</label>
                <input type="date" name="start_date" id="start_date" value="{{ start_date }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div>
                <label for="end_date" class="block text-sm font-medium text-gray-700">End Date</label>
                <input type="date" name="end_date" id="end_date" value="{{ end_date }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div>
                <label for="contributor" class="block text-sm font-medium text-gray-700">Contributor</label>
                <input type="text" name="contributor" id="contributor" value="{{ contributor }}"
                       list="contributor-list" autocomplete="off" placeholder="Search contributor…"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <datalist id="contributor-list"></datalist>
            </div>
            <div>
                <label for="editor" class="block text-sm font-medium text-gray-700">Editor</label>
                <input type="text" name="editor" id="editor" value="{{ editor }}"
                       list="editor-list" autocomplete="off" placeholder="Search editor…"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <datalist id="editor-list"></datalist>
            </div>
            <div>
                <label for="imagery" class="block text-sm font-medium text-gray-700">Imagery provider</label>
                <input type="text" name="imagery" id="imagery" value="{{ imagery }}"
                       list="imagery-list" autocomplete="off" placeholder="Search imagery…"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <datalist id="imagery-list"></datalist>
            </div>
            <div class="flex items-end">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">
                    Apply Filter
                </button>
            </div>
        </form>
    </div>

    <!-- First Part: Total Changesets and Changesets Over Time -->
    <div class="grid grid-cols-6 gap-8 mb-8">
        <!-- Total Changesets (1/6) -->
        <div class="col-span-1 bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Total Changesets</h2>
            <div class="text-4xl font-bold text-blue-600">{{ total_changesets }}</div>
        </div>

        <!-- Changesets Over Time (5/6) -->
        <div class="col-span-5 bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Changesets Over Time</h2>
            <canvas id="changesetChart"></canvas>
        </div>
    </div>

    <!-- Second Part: Three Columns -->
    <div class="grid grid-cols-3 gap-8">
        <!-- Top Contributors -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Top Contributors</h2>
            <canvas id="topContributorsChart"></canvas>
            <div class="mt-4">
                <h3 class="text-lg font-medium mb-2">Contributions Over Time</h3>
                <canvas id="topContributorsTimeChart"></canvas>
            </div>
        </div>

        <!-- Top Imageries -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Top Imageries</h2>
            <canvas id="topImageriesChart"></canvas>
            <div class="mt-4">
                <h3 class="text-lg font-medium mb-2">Usage Over Time</h3>
                <canvas id="topImageriesTimeChart"></canvas>
            </div>
        </div>

        <!-- Top Editors -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Top Editors</h2>
            <canvas id="topEditorsChart"></canvas>
            <div class="mt-4">
                <h3 class="text-lg font-medium mb-2">Usage Over Time</h3>
                <canvas id="topEditorsTimeChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
window.dashboardData = {
    dailyCounts:         {{ daily_counts_json|safe }},
    topContributors:     {{ top_contributors_json|safe }},
    topEditors:          {{ top_editors_json|safe }},
    topImageries:        {{ top_imageries_json|safe }},
    topContributorsTime: {{ top_contributors_time_json|safe }},
    topEditorsTime:      {{ top_editors_time_json|safe }},
    topImageriesTime:    {{ top_imageries_time_json|safe }},
};
</script>
{% load static %}
<script src="{% static 'js/dashboard.js' %}"></script>
<script>
function wireAutocomplete(inputId, datalistId, field) {
    document.getElementById(inputId).addEventListener('input', function () {
        const q = this.value;
        if (q.length < 1) return;
        fetch(`/api/autocomplete/?field=${field}&q=${encodeURIComponent(q)}`)
            .then(r => r.json())
            .then(values => {
                const dl = document.getElementById(datalistId);
                dl.innerHTML = values.map(v => `<option value="${v}"></option>`).join('');
            });
    });
}
wireAutocomplete('contributor', 'contributor-list', 'contributor');
wireAutocomplete('editor',      'editor-list',      'editor');
wireAutocomplete('imagery',     'imagery-list',     'imagery');
</script>
{% endblock %}
