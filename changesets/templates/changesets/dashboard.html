{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">OSM Changeset Dashboard</h1>
    
    <!-- Time Range Picker -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
        <h2 class="text-xl font-semibold mb-4">Select Time Range</h2>
        <form method="get" class="flex gap-4">
            <div>
                <label for="start_date" class="block text-sm font-medium text-gray-700">Start Date</label>
                <input type="date" name="start_date" id="start_date" value="{{ start_date }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div>
                <label for="end_date" class="block text-sm font-medium text-gray-700">End Date</label>
                <input type="date" name="end_date" id="end_date" value="{{ end_date }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div class="flex items-end">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">
                    Apply Filter
                </button>
            </div>
        </form>
    </div>

    <!-- First Part: Total Changesets and Changesets Over Time -->
    <div class="grid grid-cols-6 gap-8 mb-8">
        <!-- Total Changesets (1/6) -->
        <div class="col-span-1 bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Total Changesets</h2>
            <div class="text-4xl font-bold text-blue-600">{{ total_changesets }}</div>
        </div>

        <!-- Changesets Over Time (5/6) -->
        <div class="col-span-5 bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Changesets Over Time</h2>
            <canvas id="changesetChart"></canvas>
        </div>
    </div>

    <!-- Second Part: Three Columns -->
    <div class="grid grid-cols-3 gap-8">
        <!-- Top Contributors -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Top Contributors</h2>
            <canvas id="topContributorsChart"></canvas>
            <div class="mt-4">
                <h3 class="text-lg font-medium mb-2">Contributions Over Time</h3>
                <canvas id="topContributorsTimeChart"></canvas>
            </div>
        </div>

        <!-- Top Imageries -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Top Imageries</h2>
            <canvas id="topImageriesChart"></canvas>
            <div class="mt-4">
                <h3 class="text-lg font-medium mb-2">Usage Over Time</h3>
                <canvas id="topImageriesTimeChart"></canvas>
            </div>
        </div>

        <!-- Top Editors -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Top Editors</h2>
            <canvas id="topEditorsChart"></canvas>
            <div class="mt-4">
                <h3 class="text-lg font-medium mb-2">Usage Over Time</h3>
                <canvas id="topEditorsTimeChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Changesets Over Time Chart
    const ctx = document.getElementById('changesetChart').getContext('2d');
    const dailyData = JSON.parse('{{ daily_counts_json|safe|escapejs }}');
    if (!dailyData || dailyData.length === 0) {
        console.error('No data available for the changeset chart');
    } else {
        const data = {
            labels: dailyData.map(item => new Date(item.date).toLocaleDateString()),
            datasets: [{
                label: 'Changesets per Day',
                data: dailyData.map(item => item.count),
                borderColor: 'rgba(54, 162, 235, 1)',  // Blue
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                tension: 0.1
            }]
        };

        new Chart(ctx, {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Top Contributors Chart
    const topContributorsCtx = document.getElementById('topContributorsChart').getContext('2d');
    const topContributorsData = JSON.parse('{{ top_contributors_json|safe|escapejs }}');
    
    if (!topContributorsData || topContributorsData.length === 0) {
        console.error('No data available for the top contributors chart');
    } else {
        const topContributorsChartData = {
            labels: topContributorsData.map(item => item.user),
            datasets: [{
                label: 'Changesets',
                data: topContributorsData.map(item => item.count),
                backgroundColor: 'rgba(255, 99, 132, 0.8)',  // Pink
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 1
            }]
        };

        new Chart(topContributorsCtx, {
            type: 'bar',
            data: topContributorsChartData,
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Top Imageries Chart
    const topImageriesCtx = document.getElementById('topImageriesChart').getContext('2d');
    const topImageriesData = JSON.parse('{{ top_imageries_json|safe|escapejs }}');
    
    if (!topImageriesData || topImageriesData.length === 0) {
        console.error('No data available for the top imageries chart');
    } else {
        const topImageriesChartData = {
            labels: topImageriesData.map(item => item.imagery),
            datasets: [{
                label: 'Changesets',
                data: topImageriesData.map(item => item.count),
                backgroundColor: 'rgba(75, 192, 192, 0.8)',  // Teal
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }]
        };

        new Chart(topImageriesCtx, {
            type: 'bar',
            data: topImageriesChartData,
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Top Editors Chart
    const topEditorsCtx = document.getElementById('topEditorsChart').getContext('2d');
    const topEditorsData = JSON.parse('{{ top_editors_json|safe|escapejs }}');
    
    if (!topEditorsData || topEditorsData.length === 0) {
        console.error('No data available for the top editors chart');
    } else {
        const modernPalette = [
            'rgba(54, 162, 235, 0.8)',  // Blue
            'rgba(255, 99, 132, 0.8)',  // Pink
            'rgba(75, 192, 192, 0.8)',  // Teal
            'rgba(255, 206, 86, 0.8)',  // Yellow
            'rgba(153, 102, 255, 0.8)', // Purple
            'rgba(255, 159, 64, 0.8)',  // Orange
            'rgba(76, 175, 80, 0.8)',   // Green
            'rgba(233, 30, 99, 0.8)'    // Red
        ];

        const topEditorsChartData = {
            labels: topEditorsData.map(item => item.editor),
            datasets: [{
                label: 'Changesets',
                data: topEditorsData.map(item => item.count),
                backgroundColor: modernPalette,
                borderColor: modernPalette.map(color => color.replace('0.8', '1')),
                borderWidth: 1
            }]
        };

        new Chart(topEditorsCtx, {
            type: 'doughnut',
            data: topEditorsChartData,
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Top Contributors Time Chart
    const topContributorsTimeCtx = document.getElementById('topContributorsTimeChart').getContext('2d');
    const topContributorsTimeData = JSON.parse('{{ top_contributors_time_json|safe|escapejs }}');
    
    if (topContributorsTimeData && topContributorsTimeData.users && topContributorsTimeData.users.length > 0) {
        const topContributorsTimeChartData = {
            labels: topContributorsTimeData.dates,
            datasets: topContributorsTimeData.users.map((user, index) => ({
                label: user.name,
                data: user.counts,
                backgroundColor: `rgba(255, 99, 132, ${0.8 - (index * 0.1)})`,
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 1
            }))
        };

        new Chart(topContributorsTimeCtx, {
            type: 'bar',
            data: topContributorsTimeChartData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        stacked: true
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Top Imageries Time Chart
    const topImageriesTimeCtx = document.getElementById('topImageriesTimeChart').getContext('2d');
    const topImageriesTimeData = JSON.parse('{{ top_imageries_time_json|safe|escapejs }}');
    
    if (topImageriesTimeData && topImageriesTimeData.imageries && topImageriesTimeData.imageries.length > 0) {
        const topImageriesTimeChartData = {
            labels: topImageriesTimeData.dates,
            datasets: topImageriesTimeData.imageries.map((imagery, index) => ({
                label: imagery.name,
                data: imagery.counts,
                backgroundColor: `rgba(75, 192, 192, ${0.8 - (index * 0.1)})`,
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }))
        };

        new Chart(topImageriesTimeCtx, {
            type: 'bar',
            data: topImageriesTimeChartData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        stacked: true
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // Top Editors Time Chart
    const topEditorsTimeCtx = document.getElementById('topEditorsTimeChart').getContext('2d');
    const topEditorsTimeData = JSON.parse('{{ top_editors_time_json|safe|escapejs }}');
    
    if (topEditorsTimeData && topEditorsTimeData.editors && topEditorsTimeData.editors.length > 0) {
        const topEditorsTimeChartData = {
            labels: topEditorsTimeData.dates,
            datasets: topEditorsTimeData.editors.map((editor, index) => ({
                label: editor.name,
                data: editor.counts,
                backgroundColor: modernPalette[index % modernPalette.length],
                borderColor: modernPalette[index % modernPalette.length].replace('0.8', '1'),
                borderWidth: 1
            }))
        };

        new Chart(topEditorsTimeCtx, {
            type: 'bar',
            data: topEditorsTimeChartData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        stacked: true
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true
                    }
                }
            }
        });
    }
</script>
{% endblock %}
