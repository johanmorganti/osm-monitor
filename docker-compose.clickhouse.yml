# Optional ClickHouse backend, layered on top of docker-compose.yml.
# Enable it by adding docker-compose.clickhouse.yml to COMPOSE_FILE in .env, plus:
#   CLICKHOUSE_PASSWORD=...
#   CLICKHOUSE_DATA_DIR=/absolute/host/path   (like PGDATA_DIR: shared into the Docker VM)
# then pick where it's used: INGEST_BACKENDS=timescale,clickhouse to write to
# it, ANALYTICS_BACKEND=clickhouse to serve the API from it.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.7.9
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-osm_monitor}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-osm_monitor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env to use docker-compose.clickhouse.yml}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # Host directory, like Postgres's PGDATA_DIR, so both databases sit on the
    # same storage and their numbers compare fairly.
    volumes:
      - ${CLICKHOUSE_DATA_DIR:?set CLICKHOUSE_DATA_DIR in .env}:/var/lib/clickhouse
      # Retention + verbosity for ClickHouse's own system log tables (unbounded
      # and at `trace` level by default).
      - ./clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    # ClickHouse sizes its own memory budget from the container limit (90% by default).
    mem_limit: 4g
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface, local only (benchmarks, manual queries)
    # Datadog ClickHouse check + Database Monitoring, used only when the
    # Datadog overlay's agent runs (otherwise inert). Connects as the
    # least-privilege `datadog` user clickhouse_migrate creates from
    # DD_CLICKHOUSE_PASSWORD.
    labels:
      com.datadoghq.ad.checks: |
        {
          "clickhouse": {
            "instances": [
              {
                "server": "%%host%%",
                "port": 8123,
                "username": "datadog",
                "password": "${DD_CLICKHOUSE_PASSWORD:-}",
                "db": "${CLICKHOUSE_DB:-osm_monitor}",
                "reported_hostname": "osm-monitor-clickhouse",
                "tags": ["service:osm-monitor-clickhouse", "env:production"],
                "dbm": true
              }
            ]
          }
        }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    depends_on:
      clickhouse:
        condition: service_healthy
    # Same as the base command, plus the ClickHouse schema (idempotent).
    command: sh -c "python manage.py migrate --no-input && python manage.py load_country_boundaries --if-empty && python manage.py clickhouse_migrate"

  # The poller writes to ClickHouse (INGEST_BACKENDS), so it waits for it.
  # web doesn't: it serves the default analytics backend without ClickHouse,
  # so a ClickHouse restart must not take the dashboard down with it.
  poller:
    depends_on:
      clickhouse:
        condition: service_healthy
